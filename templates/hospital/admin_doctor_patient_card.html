{% load static %}
<style>
  .role-section { padding: 70px 0 30px; }
  .role-section h2 { text-align: center; font-weight: 700; margin-bottom: 6px; }
  .role-section .sub { text-align: center; color: #64748b; margin-bottom: 40px; }
  .role-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 28px;
               max-width: 1050px; margin: 0 auto; padding: 0 20px; }
  .role-card { background: #fff; border-radius: 18px; overflow: hidden; text-align: center;
               box-shadow: 0 8px 24px rgba(15,23,42,.08); transition: all .25s ease; }
  .role-card:hover { transform: translateY(-8px); box-shadow: 0 18px 38px rgba(11,110,138,.22); }
  .role-card img { width: 100%; display: block; }
  .role-card .body { padding: 20px 20px 26px; }
  .role-card h4 { font-weight: 600; margin: 0 0 6px; }
  .role-card p { color: #64748b; font-size: .9rem; margin-bottom: 16px; min-height: 40px; }
  .role-card .go { display: inline-block; padding: 9px 28px; border-radius: 999px; color: #fff !important;
                   background: linear-gradient(90deg, #0b6e8a, #14b8a6); font-weight: 500; text-decoration: none; }
  .role-card .go:hover { opacity: .9; color: #fff; }
</style>

<section class="role-section">
  <h2>Choose your portal</h2>
  <p class="sub">Sign in or create an account for your role</p>
  <div class="role-grid">
    <div class="role-card">
      <img src="{% static 'images/admin.svg' %}" alt="Admin">
      <div class="body">
        <h4>Admin</h4>
        <p>Manage doctors, patients, appointments and billing.</p>
        <a class="go" href="/adminclick">Open <i class="fa fa-arrow-right"></i></a>
      </div>
    </div>
    <div class="role-card">
      <img src="{% static 'images/doctor.svg' %}" alt="Doctor">
      <div class="body">
        <h4>Doctor</h4>
        <p>View your patients and handle your appointments.</p>
        <a class="go" href="/doctorclick">Open <i class="fa fa-arrow-right"></i></a>
      </div>
    </div>
    <div class="role-card">
      <img src="{% static 'images/patient.svg' %}" alt="Patient">
      <div class="body">
        <h4>Patient</h4>
        <p>Book appointments, meet doctors and download bills.</p>
        <a class="go" href="/patientclick">Open <i class="fa fa-arrow-right"></i></a>
      </div>
    </div>
  </div>
</section>
